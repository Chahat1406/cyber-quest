
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Quest | Register</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #eafaff;
      background: radial-gradient(circle at top, #173d60, transparent 45%),
                  linear-gradient(135deg, #050816, #10152b, #071c2b);
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 32px;
      border: 1px solid #27d9ff66;
      border-radius: 20px;
      background: #0a1224;
      box-shadow: 0 0 35px #00c8ff22;
    }

    h1 { text-align: center; color: #42e8ff; margin: 10px 0; }
    .subtitle, .footer { text-align: center; color: #b8c7dc; font-size: 14px; }
    .subtitle { margin-bottom: 24px; }

    label { display: block; margin: 15px 0 7px; font-size: 14px; }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 9px;
      border: 1px solid #314563;
      background: #101d32;
      color: white;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: linear-gradient(90deg, #00c8ff, #5277ff);
      color: #06101e;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; cursor: wait; }
    a { color: #42e8ff; text-decoration: none; }
    .footer { margin-top: 20px; }
    #message { margin-top: 15px; text-align: center; font-size: 14px; }
  </style>
  <style>
  body {
    background-image:
      linear-gradient(rgba(4, 10, 25, 0.35), rgba(4, 10, 25, 0.55)),
      url("/images/login-bg.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    min-height: 100vh;
  }
</style>
</head>
<body>
  <main class="card">
    <div style="text-align:center;font-size:40px">🛡️</div>
    <h1>JOIN CYBER QUEST</h1>
    <p class="subtitle">Create your player account</p>

    <form id="registerForm">
      <label for="username">Player name</label>
      <input id="username" name="username" type="text"
             minlength="2" maxlength="30" autocomplete="username" required>

      <label for="email">Email address</label>
      <input id="email" name="email" type="email"
             autocomplete="email" required>

      <label for="password">Create password</label>
      <input id="password" name="password" type="password"
             minlength="8" maxlength="72"
             autocomplete="new-password" required>

      <button id="submitBtn" type="submit">CREATE ACCOUNT →</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <p class="footer">Already registered? <a href="/login.html">Back to Login</a></p>
  </main>

  <script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const button = document.getElementById("submitBtn");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";
      button.disabled = true;

      try {
        const response = await fetch("/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Registration failed.");
        }

        message.textContent = "Account created! Opening login page...";
        message.style.color = "#69f0ae";

        setTimeout(() => {
          window.location.href = "/login.html";
        }, 1200);
      } catch (error) {
        message.textContent =
          error.message === "Failed to fetch"
            ? "Backend se connection nahi ho raha. Server check karo."
            : error.message;
        message.style.color = "#ff9c9c";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
