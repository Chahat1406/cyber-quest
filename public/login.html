
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Quest | Login</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #eafaff;
      background: radial-gradient(circle at top, #173d60, transparent 45%),
                  linear-gradient(135deg, #050816, #10152b, #071c2b);
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border: 1px solid #27d9ff66;
      border-radius: 20px;
      background: #0a1224;
      box-shadow: 0 0 35px #00c8ff22;
    }

    h1 { text-align: center; color: #42e8ff; margin: 10px 0; }
    .subtitle { text-align: center; color: #a8bbd3; margin-bottom: 25px; font-size: 14px; }
    label { display: block; margin: 16px 0 8px; font-size: 14px; }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #314563;
      background: #101d32;
      color: white;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: linear-gradient(90deg, #00c8ff, #5277ff);
      color: #06101e;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; cursor: wait; }
    a { color: #42e8ff; text-decoration: none; }
    .footer { text-align: center; margin-top: 22px; color: #b8c7dc; font-size: 14px; }
    #message { margin-top: 15px; text-align: center; font-size: 14px; }
  </style>
  <style>
  body {
    background-image:
      linear-gradient(rgba(4, 10, 25, 0.35), rgba(4, 10, 25, 0.55)),
      url("/images/login-bg.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    min-height: 100vh;
  }
</style>
</head>

<body>
  <main class="card">
    <div style="text-align:center;font-size:42px">🛡️</div>
    <h1>CYBER QUEST</h1>
    <p class="subtitle">Enter the digital world. Protect your mission.</p>

    <form id="loginForm">
    
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" type="password"
             autocomplete="current-password" required>

      <button id="loginBtn" type="submit">LOGIN TO GAME →</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
<button type="button" id="logoutBtn">LOGOUT</button>
    <p class="footer">
      New player? <a href="/register.html">Create an account</a>
    </p>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginBtn");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";
      button.disabled = true;

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Login failed.");
        }

        message.textContent = "Welcome, " + data.username + "!";
        message.style.color = "#69f0ae";

        setTimeout(() => {
         window.location.href = "/";
        }, 1000);
      } catch (error) {
        message.textContent =
          error.message === "Failed to fetch"
            ? "Backend connection failed. Check that your server is running."
            : error.message;
        message.style.color = "#ff9c9c";
      } finally {
        button.disabled = false;
      }
    });
  

  </script>
</body>
</html>
